<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logos Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A study atlas of Christianity in history, Scripture and thought: the Bible and how it reached us, the original languages word by word, belief and its arguments, Judaism and Islam compared, the ancient world, and the virtues. Every claim linked to its source.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Amiri&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Noto+Serif+Hebrew:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/app/app.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <button class="btn icon-btn" id="toc-btn" type="button" aria-label="Contents" aria-expanded="false" aria-controls="rail"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">☧</span><span class="brand-name">Logos Atlas</span><span class="brand-sub">Christianity in history, Scripture and thought</span></a>
    <button class="btn btn-primary" type="button" data-tour-start><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span class="lbl">Guided tour</span></button>
    <button class="btn icon-btn" id="theme-btn" type="button" aria-label="Switch between light and dark" title="Switch theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  </div>
</header>

<div class="layout">
  <nav class="rail" id="rail" aria-label="Contents">
    <div class="rail-search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.7 10.7l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg><input id="search" type="search" placeholder="Search the atlas" aria-label="Search the atlas" autocomplete="off"></div>
    <div class="search-results" id="search-results" hidden></div>
    <div class="toc" id="toc"></div>
    <div class="rail-foot">
      <span>Compiled by Claude (Anthropic) as study material. Check every claim against its source.</span>
      <span>Hebrew and Greek data: STEP Bible, Tyndale House, CC BY 4.0.</span>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="bible-dlg" aria-labelledby="bd-title">
  <div class="dlg">
    <div class="dlg-head"><h2 id="bd-title">Passage</h2>
      <button type="button" class="btn icon-btn" id="bd-speak" aria-label="Read aloud" title="Read aloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
      <button type="button" class="btn icon-btn dlg-close" aria-label="Close">✕</button></div>
    <div class="dlg-tabs" id="bd-tabs" role="tablist"></div>
    <div class="dlg-body" id="bd-body"></div>
  </div>
</dialog>
<dialog id="quran-dlg" aria-labelledby="qd-title">
  <div class="dlg">
    <div class="dlg-head"><h2 id="qd-title">Qur’an</h2><button type="button" class="btn icon-btn dlg-close" aria-label="Close">✕</button></div>
    <div></div>
    <div class="dlg-body" id="qd-body"></div>
  </div>
</dialog>

<div class="tourbar" id="tourbar" hidden role="region" aria-label="Guided tour">
  <div class="row"><span class="step" id="tb-step"></span>
    <select id="tb-rate" aria-label="Speaking speed"><option value="0.85">Slower</option><option value="1">Normal</option><option value="1.15">Faster</option></select>
    <button type="button" id="tb-prev" aria-label="Previous step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
    <button type="button" id="tb-play" aria-label="Pause"></button>
    <button type="button" id="tb-next" aria-label="Next step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
    <button type="button" id="tb-close" aria-label="End tour">✕</button></div>
  <p class="say" id="tb-say" aria-live="polite"></p>
  <p class="step" id="tb-note"></p>
</div>

<script src="assets/data/links.js"></script>
<script src="assets/data/geo.js"></script>
<script src="assets/data/texts.js"></script>
<script src="assets/data/books.js"></script>
<script src="assets/data/canon.js"></script>
<script src="assets/data/lab.js"></script>
<script src="assets/data/words.js"></script>
<script src="assets/data/places.js"></script>
<script src="assets/data/time-data.js"></script>
<script src="assets/data/compare-data.js"></script>
<script src="assets/data/triune-data.js"></script>
<script src="assets/data/traditions-data.js"></script>
<script src="assets/data/people-data.js"></script>
<script src="assets/data/life-data.js"></script>
<script src="assets/data/stories-data.js"></script>
<script src="assets/data/units-book.js"></script>
<script src="assets/data/units-life.js"></script>
<script src="assets/data/units-history.js"></script>
<script src="assets/data/units-belief.js"></script>
<script src="assets/data/units-compare.js"></script>
<script src="assets/data/units-people.js"></script>
<script src="assets/data/units-more.js"></script>
<script src="assets/app/core.js"></script>
<script src="assets/app/w-book.js"></script>
<script src="assets/app/w-history.js"></script>
<script src="assets/app/w-belief.js"></script>
<script src="assets/app/w-life.js"></script>
<script src="assets/app/w-more.js"></script>
<script src="assets/app/tour.js"></script>
<script>A.start();</script>
</body>
</html>
